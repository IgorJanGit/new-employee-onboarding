[project]
name = "new-employee-onboarding"
version = "0.1.0"
description = "Prototype: one place for new hires to see their onboarding plan, and for managers to track progress."
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["onboarding"]

[tool.setuptools.package-data]
onboarding = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
